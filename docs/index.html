<head>

<title>GCALIT LLC — Mercury balance sheet — FY 2025-26</title>
<meta name="description" content="Cash position for GCALIT LLC's Mercury bank account, 1 April 2025 to 31 March 2026.">

<style>
:root{
  --cell:#FFFFFF; --chrome:#F5F3EF; --chrome2:#FAF8F4; --ink:#1A1C1E; --ink2:#5A6068;
  --caps:#454B52; --grid:#E4E1DA; --edge:#D6D2C9; --accent:#0E5A38; --neg:#9A1F15;
  --selfill:rgba(14,90,56,.08); --hl:#EDEAE3;
  --ui:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --gut:52px; --row:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cell:#171A1E; --chrome:#1F2329; --chrome2:#1B1F24; --ink:#E8EAED; --ink2:#A9B0B8;
  --caps:#B7BEC6; --grid:#262B31; --edge:#333A42; --accent:#5FC48E; --neg:#F2857B;
  --selfill:rgba(95,196,142,.12); --hl:#242931;
}}
:root[data-theme="dark"]{
  --cell:#171A1E; --chrome:#1F2329; --chrome2:#1B1F24; --ink:#E8EAED; --ink2:#A9B0B8;
  --caps:#B7BEC6; --grid:#262B31; --edge:#333A42; --accent:#5FC48E; --neg:#F2857B;
  --selfill:rgba(95,196,142,.12); --hl:#242931;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--chrome);color:var(--ink);font-family:var(--ui);font-size:13px;
     display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.caps{font-family:var(--mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--caps)}

/* ---------------- answer band ---------------- */
.band{flex:0 0 auto;display:flex;align-items:stretch;background:var(--chrome);
      border-bottom:1px solid var(--edge);min-height:68px}
.band__id{display:flex;flex-direction:column;justify-content:center;gap:5px;
      padding:0 20px;border-right:1px solid var(--grid);min-width:0}
.band__id .caps{color:var(--caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band__note{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band__spark{display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;padding:0 20px;border-right:1px solid var(--grid)}
.band__spark .caps{font-size:9.5px;color:var(--ink2)}
.band__pad{flex:1 1 auto;border-right:1px solid var(--grid);min-width:0}
.figs{display:flex;align-items:stretch}
.fig{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:10px 22px;
     border-right:1px solid var(--grid);text-align:right}
.fig:last-child{border-right:0;padding-right:20px}
.fig__k{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.fig__v{font-size:28px;font-weight:600;line-height:1.02;color:var(--accent);
        font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1;letter-spacing:-.015em}
.fig--close .fig__v{border-bottom:3px double var(--accent);padding-bottom:3px}

/* ---------------- formula bar ---------------- */
.fbar{flex:0 0 auto;display:flex;align-items:stretch;height:32px;background:var(--chrome2);
      border-bottom:1px solid var(--edge)}
.namebox{width:var(--gut);min-width:var(--gut);display:flex;align-items:center;justify-content:center;
      font-family:var(--mono);font-size:11px;color:var(--ink);border-right:1px solid var(--edge)}
.fx{width:30px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-size:11px;font-style:italic;color:var(--ink2);border-right:1px solid var(--grid)}
.fval{flex:1;display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:11.5px;
      color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fval b{color:var(--accent);font-weight:600}
.tools{display:flex;align-items:stretch;border-left:1px solid var(--grid)}
.tools a,.tools button{font-family:var(--mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;
      background:none;border:0;border-right:1px solid var(--grid);color:var(--ink2);cursor:pointer;
      padding:0 14px;display:flex;align-items:center;text-decoration:none;white-space:nowrap}
.tools a:last-child,.tools button:last-child{border-right:0}
.tools a:hover,.tools button:hover{color:var(--accent);background:var(--hl)}
.tools a:focus-visible,.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------------- sheet region ---------------- */
.sheet{flex:1 1 auto;overflow:auto;background:var(--cell);position:relative;outline:none}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content}
th,td{height:var(--row);padding:0 12px;font-weight:400;text-align:left;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--grid);
      border-bottom:1px solid var(--grid);background:var(--cell)}
thead th{position:sticky;z-index:3;background:var(--chrome);user-select:none}
thead tr.letters th{top:0;height:24px;text-align:center;font-family:var(--mono);font-size:11px;
      color:var(--caps);border-bottom:1px solid var(--grid)}
thead tr.names th{top:24px;height:var(--row);font-weight:600;font-size:12.5px;color:var(--ink);
      background:var(--chrome2);border-bottom:1px solid var(--edge)}
thead tr.names th.n{text-align:right}
th.corner,th.rn,td.rn{position:sticky;left:0;width:var(--gut);min-width:var(--gut);
      background:var(--chrome);color:var(--ink2);text-align:center;font-family:var(--mono);
      font-size:11px;padding:0;border-right:1px solid var(--edge);user-select:none}
th.corner{z-index:4;top:0;cursor:pointer}
thead tr.names th.rn{z-index:4;top:24px}
td.rn{z-index:2}
td.rn.cross,thead tr.letters th.cross{background:var(--hl);color:var(--ink)}
td.n{text-align:right;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1}
td.neg{color:var(--neg)}
td.nil{color:var(--ink2)}
td.acc{color:var(--accent);font-family:var(--mono);font-size:11px;letter-spacing:.03em}
td.sel{background:var(--selfill)}
td.act{box-shadow:inset 0 0 0 2px var(--accent);background:var(--cell)}
tr.e-total td:not(.rn){font-weight:600;border-top:1px solid var(--ink)}
tr.e-open td:not(.rn),tr.e-net td:not(.rn),tr.e-close td:not(.rn){font-weight:600;color:var(--accent)}
tr.e-double td:not(.rn){font-weight:600;color:var(--accent);border-bottom:3px double var(--accent)}
tr.spacer td{height:13px}
td.ghost{color:transparent}
tr.ghost td{height:var(--row)}

/* ---------------- status bar ---------------- */
.status{flex:0 0 auto;height:24px;display:flex;align-items:center;background:var(--chrome);
      border-top:1px solid var(--edge);font-family:var(--mono);font-size:11px;color:var(--ink2);
      padding:0 14px;gap:14px}
.status__agg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status__toast{flex:1;text-align:center;color:var(--accent);opacity:0;transition:opacity .16s;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status__toast.on{opacity:1}
.status__ok{margin-left:auto;color:var(--accent);white-space:nowrap}

/* ---------------- tabs ---------------- */
.tabs{flex:0 0 auto;height:30px;display:flex;align-items:stretch;background:var(--chrome);
      border-top:1px solid var(--edge);overflow-x:auto;overflow-y:hidden}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;
     background:none;border:0;border-right:1px solid var(--grid);border-top:2px solid transparent;
     color:var(--ink2);cursor:pointer;padding:0 16px;white-space:nowrap;display:flex;
     align-items:center;gap:7px}
.tab span{color:var(--ink2);opacity:.7}
.tab:hover{background:var(--hl);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--cell);color:var(--ink);border-top:2px solid var(--accent);
     border-top-left-radius:2px;border-top-right-radius:2px;margin-top:-1px}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

@media (max-width:1100px){
  .band__spark,.band__pad{display:none}
  .band{flex-wrap:wrap}
  .band__id{width:100%;border-right:0;border-bottom:1px solid var(--grid);padding:8px 14px}
  .figs{width:100%}
  .fig{flex:1;padding:8px 14px}
  .fig__v{font-size:20px}
}
@media (max-width:560px){
  :root{--gut:36px;--row:24px}
  th,td{padding:0 8px;font-size:12px}
  .fig__v{font-size:17px}
  .tools a,.tools button{padding:0 10px}
}
@media print{
  html,body{overflow:visible;height:auto}
  .fbar,.status,.tabs,.band__spark{display:none!important}
  .sheet{overflow:visible}
  .ghost,td.ghost,tr.ghost{display:none!important}
  th,td{border-color:#000!important;background:#fff!important;color:#000!important}
  .fig__v{color:#000!important}
  .fig--close .fig__v{border-bottom-color:#000!important}
  tr.e-double td:not(.rn){border-bottom-color:#000!important;color:#000!important}
}
@media (prefers-reduced-motion:reduce){.status__toast{transition:none}}
</style>
</head>

                      : "<td>"+esc(v)+"</td>").join("")+"</tr>").join("")+"</table>";

async function put(grid,msg){
  const tsv=toTSV(grid), htm=toHTML(grid);
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        "text/plain": new Blob([tsv],{type:"text/plain"}),
        "text/html":  new Blob([htm],{type:"text/html"})})]);
    } else { await navigator.clipboard.writeText(tsv); }
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=tsv; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(_){}
    ta.remove();
  }
  toast(msg);
}
let tt;
function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2200); }
const sheetGrid = i => { const s=D.sheets[i];
  return [s.columns].concat(s.rows.map(r=>r.map(v=>v===null||v===undefined?"":v))); };

/* ---------------- events ---------------- */
$("#grid").addEventListener("mousedown",e=>{
  const td=e.target.closest("td"); if(!td||td.classList.contains("rn")) return;
  dragging=true; $("#sheet").focus();
  select(+td.dataset.r,+td.dataset.c,e.shiftKey); e.preventDefault();
});
$("#grid").addEventListener("mouseover",e=>{
  if(!dragging) return;
  const td=e.target.closest("td"); if(!td||td.classList.contains("rn")) return;
  select(+td.dataset.r,+td.dataset.c,true);
});
document.addEventListener("mouseup",()=>{dragging=false;});
document.addEventListener("keydown",e=>{
  const meta=e.ctrlKey||e.metaKey;
  if(meta && (e.key==="PageDown"||e.key==="PageUp")){
    show((cur+(e.key==="PageDown"?1:D.sheets.length-1))%D.sheets.length); e.preventDefault(); return; }
  if(meta && e.key.toLowerCase()==="c"){
    const b=bx(); if(b){ const g=cellsOf(b,false);
      put(g,"COPIED "+g.length+" ROW"+(g.length===1?"":"S")+" × "+g[0].length
        +" COL"+(g[0].length===1?"":"S")+" — PASTE INTO EXCEL"); e.preventDefault(); }
    return; }
  if(meta && e.key.toLowerCase()==="a"){ selectAll(); e.preventDefault(); return; }
  if(!act) return;
  const s=D.sheets[cur]; let {r,c}=act, moved=true;
  const maxr=s.rows.length-1, maxc=s.columns.length-1;
  switch(e.key){
    case "ArrowUp": r=Math.max(0,r-1); break;
    case "ArrowDown": r=Math.min(maxr,r+1); break;
    case "ArrowLeft": c=Math.max(0,c-1); break;
    case "ArrowRight": c=Math.min(maxc,c+1); break;
    case "Home": c=0; break;
    case "End": c=maxc; break;
    case "PageUp": r=Math.max(0,r-16); break;
    case "PageDown": r=Math.min(maxr,r+16); break;
    default: moved=false;
  }
  if(moved){ select(r,c,e.shiftKey); e.preventDefault();
    const td=document.querySelector('#grid tbody td[data-r="'+r+'"][data-c="'+c+'"]');
    if(td) td.scrollIntoView({block:"nearest",inline:"nearest"}); }
});
$("#copySheet").onclick=()=>{ const g=sheetGrid(cur);
  put(g,"COPIED SHEET "+D.sheets[cur].name.toUpperCase()+" — "+(g.length-1)+" ROWS — PASTE INTO EXCEL"); };
$("#copyAll").onclick=()=>{
  const parts=D.sheets.map((s,i)=>[[s.name.toUpperCase()+" — "+s.title]].concat(sheetGrid(i)).concat([[""]]));
  const flat=[].concat.apply([],parts);
  put(flat,"COPIED ALL "+D.sheets.length+" SHEETS — PASTE INTO EXCEL"); };
$("#theme").onclick=()=>{
  const now=document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const next=now==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  $("#theme").textContent=next==="dark"?"Light":"Dark";
  try{localStorage.setItem("gcalit-theme",next);}catch(e){}
};
(function(){ let t=null;
  try{ t=localStorage.getItem("gcalit-theme"); }catch(e){}
  if(t) document.documentElement.setAttribute("data-theme",t);
  const dark = t ? t==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  $("#theme").textContent = dark?"Light":"Dark";
})();
let rt;
addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  const keep={a:anc,b:act}; show(cur);
  if(keep.a&&keep.b){ anc=keep.a; act=keep.b; paint(); aggregate(); }
},140);});
show(0);
</script>
